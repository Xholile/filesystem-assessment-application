services:
  api:
    build:
      context: ./filesystem-backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - /:/host:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  client:
    build:
      context: ./filesystem-client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped